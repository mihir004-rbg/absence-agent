name: Absence Agent

on:
  schedule:
    # Runs every hour, on the hour (UTC). Change to taste, e.g. '0 6 * * *' for daily 6am.
    - cron: '0 * * * *'
  workflow_dispatch: {}   # allows manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write   # needed to commit reports/ and updated tasks.json back

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Absence Agent
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.groq.com/openai/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'llama-3.1-8b-instant' }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agent.py

      - name: Commit reports & updated tasks
        run: |
          git config user.name  "absence-agent[bot]"
          git config user.email "actions@github.com"
          git add reports/ tasks.json inbox.json outbox.json || true
          git diff --staged --quiet || git commit -m "agent: run $(date -u +%FT%TZ)"
          git push
